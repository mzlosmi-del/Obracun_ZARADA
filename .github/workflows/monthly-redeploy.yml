# Monthly redeploy — keeps the prerendered month name fresh.
#
# WHY THIS EXISTS
# Several pages bake the current month into their HTML at prerender time
# (/minimalna-zarada, /radni-dani-2026, /blog/porodiljsko-odsustvo,
# /blog/kako-se-obracunava-penzija). React re-computes the month on hydration,
# so a browser always looks correct — but Googlebot reads the prerendered HTML,
# which keeps last month's name until the next deploy.
#
# This fired on 7.9.2026: the 31.8 deploy baked "avgust" and Google served it
# for the first week of September.
#
# HOW IT WORKS
# On the 1st of each month it pushes an EMPTY commit to main. Vercel builds on
# every push to the production branch, so the prerender re-runs and every baked
# month name becomes current. Nothing is changed in the tree — the commit exists
# only to be a deploy trigger.
#
# WHY NOT A VERCEL DEPLOY HOOK
# A deploy hook would also work, but its URL is a bearer credential: it has to be
# created by hand in Vercel and stored as a repo secret, and anyone who obtains
# it can trigger deploys. This version needs no secret and no manual setup — the
# built-in GITHUB_TOKEN is enough. The cost is one empty commit a month in the
# history, which is a fair trade for removing a credential and two manual steps.
#
# SETUP: none. It runs as soon as this file is on main.
#
# IF IT FAILS: the likeliest cause is branch protection on main refusing a push
# from Actions. Either allow github-actions[bot] to bypass it, or switch to the
# deploy-hook version. It fails red rather than silently doing nothing, on
# purpose — a redeploy that quietly stops running is the bug this file exists to
# prevent.

name: Monthly redeploy

on:
  schedule:
    # 03:10 UTC on the 1st of every month. Off the hour on purpose —
    # GitHub delays cron jobs scheduled exactly at :00 under load.
    - cron: '10 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Push an empty commit so Vercel rebuilds and re-runs the prerender
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(prerender): monthly refresh of the baked month name" \
                                   -m "Automated by .github/workflows/monthly-redeploy.yml. No file changes — the commit exists to trigger a Vercel build so the prerendered HTML stops naming last month."
          git push origin HEAD:main
          echo "Empty commit pushed. Vercel will rebuild and the prerendered month names will be current."
