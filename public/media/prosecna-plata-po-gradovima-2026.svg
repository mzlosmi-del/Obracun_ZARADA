<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t3 d3" font-family="Inter, Arial, sans-serif">
  <title id="t3">Prosečna neto plata po gradovima i regionima u Srbiji 2026</title>
  <desc id="d3">Horizontalni bar grafikon neto zarada: Stari grad 200.666, Vračar 192.878, Beogradski region 144.028, državni prosek 121.650, Šumadija i Zapadna Srbija 90.705 dinara.</desc>
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#0f2742">Prosečna neto plata po gradovima (2026)</text>
