<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t1 d1" font-family="Inter, Arial, sans-serif">
  <title id="t1">Kretanje prosečne neto zarade u Srbiji, avgust 2025 – mart 2026</title>
  <desc id="d1">Linijski grafikon: prosečna neto zarada raste sa 105.590 dinara (avgust 2025) na 121.650 dinara (mart 2026).</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#0f2742">Prosečna neto zarada u Srbiji (din)</text>
  <text x="40" y="60" font-size="13" fill="#64748b">Avgust 2025 – mart 2026 · Izvor: Republički zavod za statistiku</text>

  <!-- gridlines + y labels (100k,110k,120k) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="100" y1="98"  x2="680" y2="98"/>
    <line x1="100" y1="210" x2="680" y2="210"/>
    <line x1="100" y1="322" x2="680" y2="322"/>
    <line x1="100" y1="350" x2="680" y2="350"/>
  </g>
  <g font-size="12" fill="#94a3b8" text-anchor="end">
    <text x="90" y="102">120.000</text>
    <text x="90" y="214">110.000</text>
    <text x="90" y="326">100.000</text>
  </g>

  <!-- area + line -->
  <polyline points="100,277 287,134 473,159 660,98" fill="none" stroke="#1f6feb" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- dots + value labels -->
  <g>
    <circle cx="100" cy="277" r="5.5" fill="#1f6feb"/>
    <text x="100" y="300" font-size="12.5" font-weight="700" fill="#0f2742" text-anchor="middle">105.590</text>
    <circle cx="287" cy="134" r="5.5" fill="#1f6feb"/>
    <text x="287" y="122" font-size="12.5" font-weight="700" fill="#0f2742" text-anchor="middle">118.429</text>
    <circle cx="473" cy="159" r="5.5" fill="#1f6feb"/>
    <text x="473" y="178" font-size="12.5" font-weight="700" fill="#0f2742" text-anchor="middle">116.127</text>
    <circle cx="660" cy="98" r="6.5" fill="#16a34a"/>
    <text x="660" y="86" font-size="13" font-weight="800" fill="#16a34a" text-anchor="middle">121.650</text>
  </g>
  <!-- x labels -->
  <g font-size="12.5" fill="#475569" text-anchor="middle">
    <text x="100" y="372">Avg 2025</text>
    <text x="287" y="372">Jan 2026</text>
    <text x="473" y="372">Feb 2026</text>
    <text x="660" y="372">Mar 2026</text>
  </g>
  <text x="40" y="406" font-size="12" fill="#94a3b8">platnilistic.rs · neto (bez poreza i doprinosa)</text>
</svg>
