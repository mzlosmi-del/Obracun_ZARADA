    <!-- Inline critical CSS to avoid FOUC before main CSS loads -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{color-scheme:light}
      body{background:#f5f7fa;color:#0f1623;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh}
    </style>

    <!-- Structured Data – site-level identity (Organization + WebSite).
         These are the ONLY global JSON-LD blocks. They are site-wide and do
         NOT duplicate per-page schema. All page-specific schema (WebApplication,
         BreadcrumbList, FAQPage) is injected per route by src/seo.jsx and is
         captured in the prerendered HTML. Do NOT add page-specific schema here. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.platnilistic.rs/#organization",
          "name": "PlatniListić",
          "url": "https://www.platnilistic.rs/",
          "logo": "https://www.platnilistic.rs/logo.svg",
          "description": "Besplatni online kalkulator za obračun zarade u Republici Srbiji.",
          "areaServed": { "@type": "Country", "name": "Serbia" }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.platnilistic.rs/#website",
          "name": "PlatniListić",
          "url": "https://www.platnilistic.rs/",
          "inLanguage": "sr-RS",
          "publisher": { "@id": "https://www.platnilistic.rs/#organization" }
        }
      ]
    }
    </script>

    <script data-goatcounter="https://platnilistic.goatcounter.com/count"
            data-goatcounter-settings='{"no_onload": true}'
            async src="//gc.zgo.at/count.js"></script>
